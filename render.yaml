services:
  # =====================================================================
  # 1. KaryaDesk Frontend Dashboard (Static Site)
  # Deploys https://be-project-gold.vercel.app on Render's Global CDN
  # =====================================================================
  - type: web
    name: karyadesk-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # =====================================================================
  # 2. KaryaDesk REST API Backend (Node.js Web Service)
  # =====================================================================
  - type: web
    name: karyadesk-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"

